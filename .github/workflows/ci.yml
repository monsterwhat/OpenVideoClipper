name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B package -DskipTests "-Dnet.bytebuddy.experimental=true"

      - name: Verify uber-jar
        run: |
          JAR=$(ls target/*-runner.jar)
          echo "Uber-jar produced: $JAR"
          test -f "$JAR"
