quarkus.application.name=ovc
quarkus.banner.enabled=false

# HTTP
quarkus.http.port=9100
quarkus.http.limits.max-body-size=50G

# SQLite + JPA (via Xerial JDBC + Hibernate community dialect)
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.jdbc.url=jdbc:sqlite:${ovc.storage.path:./data}/ovc.db
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect

# Qute
quarkus.qute.suffixes=.html
quarkus.qute.content-types."html"=text/html
quarkus.qute.strict-rendering=false

# Package as uber-jar
quarkus.package.jar.type=uber-jar

# OVC defaults
ovc.ollama.url=http://localhost:11434
ovc.ollama.model=qwen2.5
ovc.ollama.num-gpu=-1
ovc.ollama.num-ctx=0
# Optional: keep-alive and cache-path. Leave these keys UNSET - Quarkus/SmallRye
# rejects empty-string values ("key=") at startup with SRCFG00040.
ovc.transcription.provider=parakeet
ovc.transcription.batch-size=10
ovc.transcription.model=large-v3
ovc.analysis.model=qwen2.5
ovc.analysis.temperature=0.3
ovc.analysis.segment-size=3000
ovc.analysis.overlap-words=300
ovc.analysis.timeout-minutes=5
ovc.analysis.max-suggestions=15
ovc.clip.codec=copy
ovc.clip.format=mp4

# Vision analysis (Ollama multimodal - Gemma 4 family). Requires Ollama 0.20+ and `ollama pull gemma4`.
# Disabled by default - user opts in from Settings or it is skipped when no multimodal model is available.
ovc.vision.enabled=false
ovc.vision.model=gemma4:12b
ovc.vision.frame-interval=2
ovc.vision.max-frames=240
ovc.vision.batch-size=8
ovc.vision.refine-enabled=true
ovc.vision.refine-threshold=0.6
