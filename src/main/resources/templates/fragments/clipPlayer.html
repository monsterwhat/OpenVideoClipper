<div class="card">
    <div class="card-content">
        <h3 class="title is-5">{clip.suggestion.title}</h3>
        <p class="has-text-grey">{clip.suggestion.reason}</p>
        <p class="is-size-7 has-text-grey" style="margin-top: 4px;">
            {clip.suggestion.formattedStart} - {clip.suggestion.formattedEnd}
            &middot; Duration: {clip.suggestion.formattedDuration}
        </p>
    </div>
    <div class="card-image" style="position: relative;">
        <div class="video-loading-overlay" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; z-index: 1;">
            <progress class="progress is-small is-primary" max="100" style="width: 60%;"></progress>
        </div>
        <video controls style="width: 100%; max-height: 300px; background: #000;" onloadeddata="this.previousElementSibling.style.display='none'" onerror="this.previousElementSibling.innerHTML='<p class=has-text-danger>Failed to load video</p>'">
            <source src="/api/clips/{clip.id}/preview" type="video/mp4">
        </video>
    </div>
    <footer class="card-footer">
        <a class="card-footer-item" href="/api/clips/{clip.id}/video" download="{clip.filename}">
            Download
        </a>
    </footer>
</div>
